version: "3.9"

# ============================================================
# SecureProctor MERN — Production Docker Compose
# ============================================================
# Usage:
#   docker compose up -d --build
#   docker compose logs -f server
#   docker compose down -v  # removes volumes (careful!)
# ============================================================

services:
  # ────────────────────────────────────────────────────────
  # MongoDB
  # ────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: secureproctor_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-mongoadmin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-mongopassword}
      MONGO_INITDB_DATABASE: secureproctor_db
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    ports:
      - "27017:27017"
    networks:
      - secureproctor_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ────────────────────────────────────────────────────────
  # Backend API Server
  # ────────────────────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: secureproctor_server
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-mongoadmin}:${MONGO_ROOT_PASSWORD:-mongopassword}@mongodb:27017/secureproctor_db?authSource=admin
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      MEDIA_STORAGE_PATH: /app/uploads
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-52428800}
      STUN_SERVER_URL: ${STUN_SERVER_URL:-stun:stun.l.google.com:19302}
      TURN_SERVER_URL: ${TURN_SERVER_URL:-}
      TURN_USERNAME: ${TURN_USERNAME:-}
      TURN_CREDENTIAL: ${TURN_CREDENTIAL:-}
      PROCTOR_WARNING_THRESHOLD: ${PROCTOR_WARNING_THRESHOLD:-3}
      PROCTOR_AUTOSUBMIT_THRESHOLD: ${PROCTOR_AUTOSUBMIT_THRESHOLD:-5}
      RECORDING_ENABLED: ${RECORDING_ENABLED:-false}
      RECORDING_RETENTION_DAYS: ${RECORDING_RETENTION_DAYS:-30}
    volumes:
      - server_uploads:/app/uploads
    networks:
      - secureproctor_net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/api/v1/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s
    expose:
      - "5000"

  # ────────────────────────────────────────────────────────
  # Frontend (built static files served by nginx inside image)
  # ────────────────────────────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${API_BASE_URL:-/api/v1}
        VITE_SOCKET_URL: ${SOCKET_URL:-/}
    container_name: secureproctor_client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    networks:
      - secureproctor_net
    expose:
      - "80"

  # ────────────────────────────────────────────────────────
  # Nginx Reverse Proxy
  # ────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: secureproctor_nginx
    restart: unless-stopped
    depends_on:
      - client
      - server
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - secureproctor_net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

# ────────────────────────────────────────────────────────
# Named Volumes
# ────────────────────────────────────────────────────────
volumes:
  mongo_data:
    name: secureproctor_mongo_data
  mongo_config:
    name: secureproctor_mongo_config
  server_uploads:
    name: secureproctor_server_uploads

# ────────────────────────────────────────────────────────
# Network
# ────────────────────────────────────────────────────────
networks:
  secureproctor_net:
    name: secureproctor_network
    driver: bridge
